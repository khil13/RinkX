[project]
name = "rinkx"
version = "0.1.0"
description = "RinkX data pipeline: ingest, model, price, publish (runs in GitHub Actions)"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.scripts]
rinkx = "rinkx.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rinkx"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rinkx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
