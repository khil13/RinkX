name: keepalive

# GitHub silently disables scheduled workflows in public repos after 60 days without
# repository activity, and pipeline runs don't count as activity. Re-enabling through the
# API resets that clock. Weekly is well inside the window.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every workflow with a schedule (CI checks this list against .github/workflows).
          for wf in pipeline.yml watchdog.yml keepalive.yml; do
            gh workflow enable "$wf" --repo "$GITHUB_REPOSITORY"
          done
          # Verify: fail loudly (GitHub emails the owner) if any of them is still not active.
          gh workflow list --all --json path,state --repo "$GITHUB_REPOSITORY" \
            | python3 -c "import json,sys; bad=[w for w in json.load(sys.stdin) if w['path'].split('/')[-1] in ('pipeline.yml','watchdog.yml','keepalive.yml') and w['state']!='active']; print(bad or 'all scheduled workflows active'); sys.exit(1 if bad else 0)"
