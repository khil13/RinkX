name: pipeline

# One workflow for every scheduled job, so there is a single "Run workflow" button and a
# single concurrency group guarding the data store. Phase 0 only publishes; later phases
# add stages (ingest, models, pricing, alerts, grading) chosen by the time of day.
on:
  schedule:
    - cron: "17 * * * *" # hourly baseline (minute 17 avoids the top-of-hour rush)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "pipeline/**", "db/**", "config/**", ".github/workflows/pipeline.yml"]

permissions:
  contents: write # read code + manage the encrypted store on the `store` release
  pages: write
  id-token: write

concurrency:
  group: rinkx-store
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install ./pipeline

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - name: Run pipeline and publish bundle
        env:
          RINKX_ENV: prod
          # Empty until setup is done; the pipeline then publishes a setup-only site.
          RINKX_DATA_KEY: ${{ secrets.DATA_KEY }}
          RINKX_STORE_KEY: ${{ secrets.STORE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python -m rinkx run --out web/dist/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
