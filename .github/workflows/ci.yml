name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e "./pipeline[dev]"
      - run: ruff check . && ruff format --check .
        working-directory: pipeline
      - run: mypy
        working-directory: pipeline
      - run: pytest -q
        working-directory: pipeline
      - run: python db/tests/test_schema.py
      - run: python scripts/lint_copy.py
      # Run the pipeline exactly as pipeline.yml does: a regular (non-editable) install, from the
      # repo root, prod env, no keys. Catches anything that only works from an editable install.
      - name: Smoke-test the installed pipeline like production
        run: |
          python -m venv /tmp/prod
          /tmp/prod/bin/pip install -q ./pipeline
          RINKX_ENV=prod /tmp/prod/bin/python -m rinkx run --out /tmp/site-data
          test -f /tmp/site-data/manifest.json
          python -c "import json; m=json.load(open('/tmp/site-data/manifest.json')); assert m['configured'] is False, m"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install ./pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
        env:
          RINKX_PYTHON: python
